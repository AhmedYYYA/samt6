<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAMT responsive review fixture</title>
  <style>
    body { margin:24px; color:#281f28; background:#eee; font:16px system-ui,sans-serif; }
    label { display:block; margin-bottom:16px; }
    select { font:inherit; padding:8px; }
    iframe { display:block; width:390px; height:844px; max-width:100%; border:1px solid #aaa; background:white; }
  </style>
</head>
<body>
  <h1>SAMT responsive review fixture</h1>
  <label>Preview width <select id="width"><option value="390">390 px · phone</option><option value="768">768 px · tablet</option><option value="1200">1200 px · desktop</option></select></label>
  <iframe src="../?release=1.0.1" title="SAMT responsive preview"></iframe>
  <script>document.querySelector('#width').addEventListener('change',event=>{document.querySelector('iframe').style.width=event.target.value+'px';});</script>
</body>
</html>
